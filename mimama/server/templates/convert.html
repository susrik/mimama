<div class="card bg-base-100 shadow">
  <div class="card-body">
    <h2 class="card-title">Convert transcript to minutes</h2>
    <form hx-post="/gui/convert" hx-target="#main" class="space-y-2">
      <label class="form-control">
        <span class="label-text">Target folder</span>
        <select name="folder" class="select select-bordered">
          {% for folder in folders %}
          <option value="{{ folder }}">/{{ folder }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="form-control">
        <span class="label-text">Output filename (blank = dated default)</span>
        <input type="text" name="filename" class="input input-bordered" placeholder="2026-08-30-minutes.md">
      </label>
      <label class="form-control">
        <span class="label-text">Transcript</span>
        <textarea name="transcript" rows="12" class="textarea textarea-bordered" required></textarea>
      </label>
      <button type="submit" class="btn btn-primary">Convert</button>
    </form>
  </div>
</div>
