<div class="card bg-base-100 shadow">
  <div class="card-body">
    <h2 class="card-title">Transcription Result</h2>
    <textarea class="textarea textarea-bordered" rows="15" readonly>{{ transcript }}</textarea>
    <div class="card-actions justify-end mt-4">
      <button class="btn btn-primary" onclick="navigator.clipboard.writeText('{{ transcript }}')">Copy to Clipboard</button>
    </div>
  </div>
</div>
