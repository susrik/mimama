<div class="card bg-base-100 shadow">
  <div class="card-body">
    <h2 class="card-title">{{ path }}</h2>
    <pre class="whitespace-pre-wrap text-sm bg-base-200 p-4 rounded">{{ content }}</pre>
    <div class="card-actions">
      <form hx-post="/gui/cleanup" hx-target="#main">
        <input type="hidden" name="path" value="{{ path }}">
        <button type="submit" class="btn btn-secondary btn-sm">Clean up with LLM</button>
      </form>
    </div>
    {% if context %}
    <details class="collapse collapse-arrow bg-base-200">
      <summary class="collapse-title text-sm">Folder context (AGENTS.md chain)</summary>
      <div class="collapse-content"><pre class="whitespace-pre-wrap text-xs">{{ context }}</pre></div>
    </details>
    {% endif %}
  </div>
</div>
