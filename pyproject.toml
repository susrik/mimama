[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mimama"
version = "0.1.0"
description = "LLM-assisted manager for a human-readable tree of markdown meeting notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "click>=8.1",
    "openai>=1.50",
    "discord.py>=2.4",
    "mcp>=1.2",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "olefile>=0.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
mimama = "mimama.cli.main:cli"
mimama-mcp = "mimama.mcp.server:main"

[tool.setuptools.packages.find]
include = ["mimama*"]

[tool.setuptools.package-data]
"mimama.server" = ["templates/*.html"]

# --- tools ---

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# discord.py and mcp ship types; openai does too.

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=mimama --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["mimama"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
